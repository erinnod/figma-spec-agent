<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="-apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#031220"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2540"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006fac"/>
      <stop offset="100%" stop-color="#004d7a"/>
    </linearGradient>
    <linearGradient id="card3a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6b5c"/>
      <stop offset="100%" stop-color="#0d3d2e"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#006fac" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#006fac" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="rgba(255,255,255,0.45)" letter-spacing="3">HOW IT WORKS</text>
  <text x="600" y="108" text-anchor="middle" font-size="42" font-weight="800" fill="#ffffff">From Figma to Decisions in Minutes</text>
  <text x="600" y="144" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.55)">An AI agent that reads your designs and surfaces every question that matters — before a single line of code is written</text>

  <!-- ── STEP 1 ── -->
  <rect x="60" y="195" width="310" height="330" rx="16" fill="url(#card1)" filter="url(#shadow)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Step badge -->
  <rect x="84" y="218" width="60" height="22" rx="11" fill="rgba(0,111,172,0.5)"/>
  <text x="114" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.9)" letter-spacing="1">STEP 1</text>
  <!-- Figma icon mockup -->
  <circle cx="215" cy="298" r="42" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="215" y="310" text-anchor="middle" font-size="44" fill="#1ABCFE">&#9632;</text>
  <text x="140" y="310" text-anchor="middle" font-size="28" fill="rgba(255,255,255,0.15)">&#9632;</text>
  <text x="290" y="310" text-anchor="middle" font-size="28" fill="rgba(255,255,255,0.15)">&#9632;</text>

  <text x="215" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Share Your Figma Link</text>
  <text x="215" y="398" text-anchor="middle" font-size="13.5" fill="rgba(255,255,255,0.55)" xml:space="preserve">Paste a Figma URL into Cursor</text>
  <text x="215" y="418" text-anchor="middle" font-size="13.5" fill="rgba(255,255,255,0.55)">or Claude Code. That's it.</text>
  <text x="215" y="452" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)">No setup. No exporting. No manual work.</text>

  <!-- Arrow 1 -->
  <g transform="translate(395, 340)">
    <line x1="0" y1="20" x2="65" y2="20" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6 3"/>
    <polygon points="65,14 80,20 65,26" fill="#006fac" opacity="0.9"/>
    <text x="40" y="12" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.35)" letter-spacing="0.5">AUTO</text>
  </g>

  <!-- ── STEP 2 ── -->
  <rect x="445" y="195" width="310" height="330" rx="16" fill="url(#card2)" filter="url(#shadow)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="469" y="218" width="60" height="22" rx="11" fill="rgba(255,255,255,0.18)"/>
  <text x="499" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.9)" letter-spacing="1">STEP 2</text>

  <!-- AI brain icon -->
  <circle cx="600" cy="298" r="42" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="600" y="314" text-anchor="middle" font-size="42">&#129504;</text>

  <text x="600" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">AI Reviews Every Screen</text>
  <text x="600" y="398" text-anchor="middle" font-size="13.5" fill="rgba(255,255,255,0.7)">The agent analyses each design frame,</text>
  <text x="600" y="418" text-anchor="middle" font-size="13.5" fill="rgba(255,255,255,0.7)">spots gaps, and writes questions.</text>
  <text x="600" y="452" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.45)">Business questions · Technical questions · Evidence cited</text>

  <!-- Arrow 2 -->
  <g transform="translate(780, 340)">
    <line x1="0" y1="20" x2="65" y2="20" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6 3"/>
    <polygon points="65,14 80,20 65,26" fill="#006fac" opacity="0.9"/>
    <text x="40" y="12" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.35)" letter-spacing="0.5">INSTANT</text>
  </g>

  <!-- ── STEP 3 ── -->
  <rect x="830" y="195" width="310" height="330" rx="16" fill="url(#card1)" filter="url(#shadow)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="854" y="218" width="60" height="22" rx="11" fill="rgba(26,107,92,0.7)"/>
  <text x="884" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="rgba(255,255,255,0.9)" letter-spacing="1">STEP 3</text>

  <!-- Two report icons -->
  <g transform="translate(985, 256)">
    <!-- Customer report mini card -->
    <rect x="-50" y="0" width="38" height="48" rx="5" fill="#006fac" opacity="0.9"/>
    <rect x="-44" y="8" width="26" height="3" rx="1.5" fill="rgba(255,255,255,0.7)"/>
    <rect x="-44" y="15" width="20" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <rect x="-44" y="21" width="22" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <rect x="-44" y="27" width="18" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <text x="-31" y="58" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">Customer</text>
    <!-- Developer report mini card -->
    <rect x="12" y="0" width="38" height="48" rx="5" fill="#1a6b5c" opacity="0.9"/>
    <rect x="18" y="8" width="26" height="3" rx="1.5" fill="rgba(255,255,255,0.7)"/>
    <rect x="18" y="15" width="20" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <rect x="18" y="21" width="22" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <rect x="18" y="27" width="18" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
    <text x="31" y="58" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">Developer</text>
  </g>

  <text x="985" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Two Polished Reports</text>
  <text x="985" y="398" text-anchor="middle" font-size="13.5" fill="rgba(255,255,255,0.55)">One for stakeholders. One for engineers.</text>
  <text x="985" y="418" text-anchor="middle" font-size="13.5" fill="rgba(255,255,255,0.55)">Both ready to share immediately.</text>
  <text x="985" y="452" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)">Self-contained HTML · No login required · Print-ready</text>

  <!-- Bottom tagline -->
  <line x1="60" y1="555" x2="1140" y2="555" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="600" y="595" text-anchor="middle" font-size="15" fill="rgba(255,255,255,0.35)">What used to take a senior developer 2–3 hours now happens in under 2 minutes — with nothing missed.</text>

  <!-- Accent dots -->
  <circle cx="580" cy="595" r="3" fill="#006fac" opacity="0.5"/>
  <circle cx="620" cy="595" r="3" fill="#1a6b5c" opacity="0.5"/>
</svg>
